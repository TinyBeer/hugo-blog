baseURL: https://tinybeer.github.io/hugo-blog
# 博客语言
# languageCode: zh-cn
locale: zh-cn
defaultContentLanguage: zh-cn
defaultContentLanguageInSubdir: false
# 博客名称
title: "🍺Let's Beer!!"
# 主题
theme: ["PaperModXP"]
# 每页多少文章
# 官方文档中使用的 paginate 已经弃用
paginate.pagerSize: 5

# 方便搜索引擎爬取数据
enableRobotsTXT: true

buildDrafts: false
buildFuture: false
buildExpired: false

# Todo 不生效  需要研究一下 目前先注释掉
# googleAnalytics: UA-123-45

# 压缩部署文件大小
minify:
  disableXML: true
  minifyOutput: true

params:
  # 指定当前环境
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  # 站点标题
  title: "🍺Let's Beer!!"
  # 站点描述
  description: "TinyBeer"
  # 站点关键词
  keywords: [Blog, PaperMod]
  # 作者
  author: 
    name: "TinyBeer"
    email: "543595604@qq.com"
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  # 日期格式
  DateFormat: "2006-01-02"
  # 默认主题色
  defaultTheme: auto # dark, light
  # 禁用主题选择
  disableThemeToggle: false
  # 显示阅读时间
  ShowReadingTime: true
  # 显示分享按钮
  ShowShareButtons: false
  # 显示文章导航链接
  ShowPostNavLinks: false
  # 显示面包屑导航
  ShowBreadCrumbs: false
  # 显示代码拷贝按钮
  ShowCodeCopyButtons: true
  # 显示字数统计
  ShowWordCount: true
  # 显示RSS订阅按钮
  ShowRssButtonInSectionTermList: flase
  disableSpecial1stPost: true
  # 关闭回到顶部按钮
  disableScrollToTop: false
  hideFooter: false
  # 目录位置
  TocSide: "right" # or 'left'

  EnableInstantClick: false

  languageAltTitle: “English”
  displayFullLangName: true
  disablePostNavLink: true

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: "Beer"
    # icon: /apple-touch-icon.png
    iconHeight: 35

  # # profile-mode
  # profileMode:
  #   enabled: false # needs to be explicitly set
  #   title: ExampleSite
  #   subtitle: "This is subtitle"
  #   imageUrl: "<img location>"
  #   imageWidth: 120
  #   imageHeight: 120
  #   imageTitle: my image
  #   buttons:
  #     - name: Posts
  #       url: posts
  #     - name: Tags
  #       url: tags

  # # home-info mode
  # homeInfoParams:
  #   Title: "Hi there \U0001F44B"
  #   Content: Welcome to my blog

  # socialIcons:
  #   - name: x
  #     url: "https://x.com/"
  #   - name: stackoverflow
  #     url: "https://stackoverflow.com"
  #   - name: github
  #     url: "https://github.com/"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

  defaultCommentSystems:
    giscus: true
  commentSystems:
    giscus: 
      repo: "TinyBeer/hugo-blog"
      repo_id: "R_kgDOQse4ZQ"
      category: "Announcements"
      category_id: "DIC_kwDOQse4Zc4C0Jfi"
      mapping: "pathname"
      position: "bottom"
      theme: "dark_dimmed"
      lang: "en"
      loading: "lazy"
      crossorigin: "anonymous"
      strict: "0"
      reactions_enabled: "1"
      emit_metadata: "0"

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 1
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 2
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 3
    - identifier: search
      name: 搜索
      url: /search/
      weight: 4
    # - identifier: auth
    #   name: 作者
    #   url: "https://baidu.com"
    #   weight: 5
    #   params:
    #     external: true

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

caches:
  images:
    dir: :cacheDir/images
